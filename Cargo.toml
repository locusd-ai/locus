[workspace]
resolver = "2"
members = [
    "crates/locus-core",
    "crates/locus-parser",
    "crates/locus-registry",
    "crates/locus-bitmap",
    "crates/locus-ingest",
    "crates/locus-watcher",
    "crates/locus-query",
    "crates/locus-cli",
    "crates/locus-daemon",
    "crates/locus-enrich",
    "crates/locus-embed",
    "crates/locus-code",
]

[workspace.package]
version = "0.1.0"
edition = "2021"
license = "MIT"
rust-version = "1.75"

[workspace.dependencies]
# Internal crates
locus-core = { path = "crates/locus-core" }
locus-parser = { path = "crates/locus-parser" }
locus-registry = { path = "crates/locus-registry" }
locus-bitmap = { path = "crates/locus-bitmap" }
locus-ingest = { path = "crates/locus-ingest" }
locus-watcher = { path = "crates/locus-watcher" }
locus-query = { path = "crates/locus-query" }
locus-enrich = { path = "crates/locus-enrich" }
locus-embed = { path = "crates/locus-embed" }
locus-code = { path = "crates/locus-code" }

# Serialization
serde = { version = "1", features = ["derive"] }
serde_json = "1"
serde_yaml = "0.9"
toml = "0.8"

# Error handling & logging
thiserror = "2"
anyhow = "1"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }

# Bitmap
roaring = "0.10"

# Hashing
blake3 = "1"

# Storage — will be needed by implementations
duckdb = { version = "1", features = ["bundled"] }
heed = "0.20"

# Testing
tempfile = "3"

# CLI
clap = { version = "4", features = ["derive"] }

# Async runtime (daemon only)
tokio = { version = "1", features = ["full"] }

# Filesystem watching
notify = "8"
notify-debouncer-mini = "0.6"
globset = "0.4"

# MCP
rmcp = { version = "1", features = ["server", "transport-io"] }
schemars = "1"

# HTTP
axum = "0.8"
tower = "0.5"

# Config
dirs = "6"

# Embedding
fastembed = "5"
usearch = "2"

# Benchmarking
criterion = { version = "0.5", features = ["html_reports"] }
rand = "0.8"
