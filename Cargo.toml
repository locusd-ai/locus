[workspace]
resolver = "2"
members = [
    "crates/biem-core",
    "crates/biem-parser",
    "crates/biem-registry",
    "crates/biem-bitmap",
    "crates/biem-ingest",
    "crates/biem-watcher",
    "crates/biem-query",
    "crates/biem-cli",
    "crates/biem-daemon",
]

[workspace.package]
version = "0.1.0"
edition = "2021"
license = "MIT"
rust-version = "1.75"

[workspace.dependencies]
# Internal crates
biem-core = { path = "crates/biem-core" }
biem-parser = { path = "crates/biem-parser" }
biem-registry = { path = "crates/biem-registry" }
biem-bitmap = { path = "crates/biem-bitmap" }
biem-ingest = { path = "crates/biem-ingest" }
biem-watcher = { path = "crates/biem-watcher" }
biem-query = { path = "crates/biem-query" }

# Serialization
serde = { version = "1", features = ["derive"] }
serde_json = "1"
serde_yaml = "0.9"
toml = "0.8"

# Error handling & logging
thiserror = "2"
anyhow = "1"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }

# Bitmap
roaring = "0.10"

# Hashing
blake3 = "1"

# Storage — will be needed by implementations
duckdb = { version = "1", features = ["bundled"] }
heed = "0.20"

# Testing
tempfile = "3"

# CLI
clap = { version = "4", features = ["derive"] }

# Async runtime (daemon only)
tokio = { version = "1", features = ["full"] }

# Filesystem watching
notify = "8"
notify-debouncer-mini = "0.6"
globset = "0.4"

# MCP
rmcp = { version = "1", features = ["server", "transport-io"] }
schemars = "1"

# HTTP
axum = "0.8"
tower = "0.5"

# Config
dirs = "6"
