[package]
name = "biem-embed"
description = "Embedding and vector search for BIEM"
version.workspace = true
edition.workspace = true

[dependencies]
biem-core = { workspace = true }
tracing = { workspace = true }
fastembed = { workspace = true, optional = true }

[features]
default = ["fastembed-embedder"]
fastembed-embedder = ["dep:fastembed"]

[dev-dependencies]
tempfile = { workspace = true }
